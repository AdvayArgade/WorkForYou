
<!DOCTYPE html>
<html>
<head>

    <title>Signup</title>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/just-validate@latest/dist/just-validate.production.min.js" defer></script>
    <script src="/js/validation.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <style>
    @import url('https://fonts.googleapis.com/css?family=Lato');

        body {
            font-family: 'Lato', sans-serif;
        }

        h1, h2, h3, h4, h5, h6,
        label {
            font-family: 'Lato', sans-serif;
        }
        .center-box {
            margin: 0 auto;
            width: 50%;
            padding: 10px;
            border: 1px solid black;
        }
        h1 {
            color: rgb(174, 16, 222);
        }
        button {
  background-color: #b70eff;
  color: white;
  border: none;
  padding: 10px;
}
input, select {
  display: inline-block;
  margin: 10px;
}

    </style>
</head>
<body>
{% for message in get_flashed_messages() %}
    <div class="alert alert-warning alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

{% endfor %}
    <div class="center-box">
        <h1>Signup</h1>
        <form action="{{ url_for('SP_signup') }}" method="post" id="signup">
            <div>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" style="margin-left: 6vh;">
            </div>
            
            <div>
                <label for="ph_no">Phone Number</label>
                <input type="ph_no" id="ph_no" name="ph_no">
            </div>

            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password">
            </div>

            <div>
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob">
            </div>


            <div>
                <label for="profession">Profession</label>
                <select id="profession" name="profession">
                    <option value="Carpenter">Carpenter</option>
                    <option value="Plumber">Plumber</option>
                    <option value="Housemaid">Housemaid</option>
                    <option value="Car Cleaner">Car Cleaner</option>

                </select>
            </div>


            <div>
                <label for="w_location">Location</label>
                <select id="w_location" name="w_location">
                    <option value="Alandi">Alandi</option>
                    <option value="Bibewadi">Bibewadi</option>
                    <option value="Katraj">Katraj</option>
                    <option value="Shivajinagar">Shivajinagar</option>
                    <option value="Pimpri chinchwad">Pimpri chinchwad</option>
                    <option value="Wagholi">Wagholi</option>

                </select>
            </div>

            <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>

            <button type="submit">Sign up</button>
        </form>
    </div>
</body>
</html>
