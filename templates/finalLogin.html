<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="{{ url_for('static', filename='output.css') }}" rel="stylesheet">
    <link rel="shortcut icon" href="{{ url_for('static', filename='fav3.png') }}" type="image/x-icon">
<!--    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">-->
<!--    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>-->
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="w-full max-w-md bg-white shadow-lg rounded-lg p-8">
        {% for message in get_flashed_messages() %}
        <div class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4 mb-4 rounded-lg flex items-center justify-between" role="alert">
            <span>{{ message }}</span>
            <button type="button" class="text-yellow-700 hover:text-yellow-900 font-bold" aria-label="Close" onclick="this.parentElement.style.display='none';">
                &times;
            </button>
        </div>

        {% endfor %}

        <h1 class="text-3xl font-semibold text-purple-700 text-center mb-6">Login</h1>

        {% if w_logged_in %}
        <form action="{{ url_for('spLogin') }}" method="post" id="w_login" class="space-y-6">
            <div class="flex flex-col">
                <label for="w_name" class="text-gray-700 font-medium">Username</label>
                <input type="text" id="w_name" name="w_name" class="border border-gray-300 rounded-lg p-3 w-full" required>
            </div>
            <div class="flex flex-col">
                <label for="w_password" class="text-gray-700 font-medium">Password</label>
                <input type="password" id="w_password" name="w_password" class="border border-gray-300 rounded-lg p-3 w-full" required>
            </div>
            <p class="text-sm text-gray-500">Don't have an account? <a href="{{ url_for('SP_signup') }}" class="text-purple-600 hover:underline">Create an account</a></p>
            <button class="w-full bg-purple-600 text-white rounded-lg py-3 hover:bg-purple-700 transition-colors">Login</button>
        </form>

        {% elif c_logged_in %}
        <form action="{{ url_for('customerLogin') }}" method="post" id="c_login" class="space-y-6">
            <div class="flex flex-col">
                <label for="c_name" class="text-gray-700 font-medium">Username</label>
                <input type="text" id="c_name" name="c_name" class="border border-gray-300 rounded-lg p-3 w-full" required>
            </div>
            <div class="flex flex-col">
                <label for="c_password" class="text-gray-700 font-medium">Password</label>
                <input type="password" id="c_password" name="c_password" class="border border-gray-300 rounded-lg p-3 w-full" required>
            </div>
            <p class="text-sm text-gray-500">Don't have an account? <a href="{{ url_for('Customer_signup') }}" class="text-purple-600 hover:underline">Create an account</a></p>
            <button class="w-full bg-purple-600 text-white rounded-lg py-3 hover:bg-purple-700 transition-colors">Login</button>
        </form>
        {% endif %}
    </div>
</body>
</html>
