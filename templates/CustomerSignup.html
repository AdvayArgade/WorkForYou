<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <script src="https://unpkg.com/just-validate@latest/dist/just-validate.production.min.js" defer></script>
    <script src="/js/validation.js" defer></script>
    <link href="{{ url_for('static', filename='output.css') }}" rel="stylesheet">
    <link rel="shortcut icon" href="{{ url_for('static', filename='fav3.png') }}" type="image/x-icon">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    {% for message in get_flashed_messages() %}
    <div class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4 mb-4 rounded-lg flex items-center justify-between" role="alert">
        <span>{{ message }}</span>
        <button type="button" class="text-yellow-700 hover:text-yellow-900 font-bold" aria-label="Close" onclick="this.parentElement.style.display='none';">
            &times;
        </button>
    </div>
    {% endfor %}

    <div class="w-full max-w-md bg-white shadow-lg rounded-lg p-6">
        <h1 class="text-3xl font-semibold text-purple-700 text-center mb-4">Signup</h1>

        <form action="{{ url_for('Customer_signup') }}" method="post" id="signup" class="space-y-4">
            <div class="flex flex-col">
                <label for="name" class="text-gray-700 font-medium">Name</label>
                <input type="text" id="name" name="name" class="border border-gray-300 rounded-lg py-2 px-3 w-full" required>
            </div>

            <div class="flex flex-col">
                <label for="ph_no" class="text-gray-700 font-medium">Phone Number</label>
                <input type="text" id="ph_no" name="ph_no" class="border border-gray-300 rounded-lg py-2 px-3 w-full" required>
            </div>

            <div class="flex flex-col">
                <label for="password" class="text-gray-700 font-medium">Password</label>
                <input type="password" id="password" name="password" class="border border-gray-300 rounded-lg py-2 px-3 w-full" required>
            </div>

            <div class="flex flex-col">
                <label for="dob" class="text-gray-700 font-medium">Date of Birth</label>
                <input type="date" id="dob" name="dob" class="border border-gray-300 rounded-lg py-2 px-3 w-full" required>
            </div>

            <div class="flex flex-col">
                <label for="c_location" class="text-gray-700 font-medium">Location</label>
                <input type="text" id="c_location" name="c_location" class="border border-gray-300 rounded-lg py-2 px-3 w-full" required>
            </div>

            <p class="text-sm text-gray-500">Already have an account? <a href="{{ url_for('login') }}" class="text-purple-600 hover:underline">Login</a></p>

            <button type="submit" class="w-full bg-purple-600 text-white rounded-lg py-2 hover:bg-purple-700 transition-colors">Sign up</button>
        </form>
    </div>
</body>
</html>
